name: Factory issue labeled

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement (for controlled end-to-end tests)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: factory-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement_from_label:
    name: implement (label)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      github.event.label.name == 'factory-ready' &&
      github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      COMMENT_BODY: ''
      COMMENT_AUTHOR: ''
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - name: Find existing factory PR for this issue
        id: existing-pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PREFIX="factory/issue-${ISSUE_NUMBER}-"

          PR_JSON="$(gh api "repos/${REPOSITORY}/pulls?state=open&per_page=100" 2>/dev/null || echo '[]')"
          MATCH="$(echo "$PR_JSON" | jq -r --arg prefix "$PREFIX" '
            ([ .[]
              | select(.head.ref | startswith($prefix))
              | {updated_at: .updated_at, branch: .head.ref, number: .number, url: .html_url}
            ]
            | sort_by(.updated_at)
            | reverse
            | .[0]
            )
            | select(. != null)
            | "\(.branch)\t\(.number)\t\(.url)"
          ')"

          if [[ -z "${MATCH}" || "${MATCH}" == "null" ]]; then
            EXISTING_BRANCH=""
            EXISTING_PR_NUMBER=""
            EXISTING_PR_URL=""
          else
            IFS=$'\t' read -r EXISTING_BRANCH EXISTING_PR_NUMBER EXISTING_PR_URL <<< "${MATCH}"
          fi

          {
            echo "branch=${EXISTING_BRANCH}"
            echo "pr_number=${EXISTING_PR_NUMBER}"
            echo "pr_url=${EXISTING_PR_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve issue metadata
        id: issue-meta
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE_JSON="$(gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}")"
          {
            echo "title<<FACTORY_META_EOF"
            jq -r '.title // ""' <<< "${ISSUE_JSON}"
            echo "FACTORY_META_EOF"
            echo "body<<FACTORY_META_EOF"
            jq -r '.body // ""' <<< "${ISSUE_JSON}"
            echo "FACTORY_META_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          node --version
          opencode --version

      - name: Verify repository layout
        working-directory: factory
        run: |
          set -euo pipefail
          for path in ../.github/workflows ../app ../tofu ../README.md; do
            if [[ ! -e "${path}" ]]; then
              echo "ERROR: Expected path does not exist: ${path}" >&2
              exit 1
            fi
          done
          echo "Repository layout OK"

      - name: Render agent prompt
        working-directory: factory
        env:
          EXISTING_BRANCH: ${{ steps.existing-pr.outputs.branch }}
          EXISTING_PR_URL: ${{ steps.existing-pr.outputs.pr_url }}
          EXISTING_PR_NUMBER: ${{ steps.existing-pr.outputs.pr_number }}
          ISSUE_TITLE: ${{ steps.issue-meta.outputs.title || github.event.issue.title }}
          ISSUE_BODY: ${{ steps.issue-meta.outputs.body || github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          template = Path("prompts/implement.md").read_text()
          rendered = template

          issue_body = os.environ.get("ISSUE_BODY", "")
          comment_body = os.environ.get("COMMENT_BODY", "").strip()
          if comment_body:
            issue_body = issue_body + "\n\nLatest comment:\n" + comment_body

          for key in ("REPOSITORY", "ISSUE_NUMBER", "ISSUE_TITLE", "ISSUE_BODY", "DEFAULT_BRANCH", "EXISTING_BRANCH", "EXISTING_PR_URL", "EXISTING_PR_NUMBER"):
              if key == "ISSUE_BODY":
                rendered = rendered.replace(f"${key}", issue_body)
              else:
                rendered = rendered.replace(f"${key}", os.environ[key])
          Path("/tmp/factory-prompt.md").write_text(rendered)
          PY

      - name: Run implementation agent
        id: agent
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: factory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/factory-runs"
          MODEL="${OPENCODE_MODEL:-opencode/gpt-5.4-nano}"
          LOG="${RUNNER_TEMP}/factory-runs/issue-${ISSUE_NUMBER}.log"

          is_transient() {
            local tail
            tail="$(tail -n 20 "${LOG}" 2>/dev/null || echo '')"
            echo "${tail}" | grep -qiE "rate.limit|timeout|ECONNRESET|ETIMEDOUT|502|503|network error|connection refused|EAI_AGAIN|ENOTFOUND|too many requests|429"
          }

          # Attempt 1
          if opencode run --auto --model "$MODEL" "$(cat /tmp/factory-prompt.md)" \
             | tee "${LOG}"; then
            exit 0
          fi

          # Attempt 2 (transient only, 30s backoff)
          if is_transient; then
            sleep 30
            if opencode run --auto --model "$MODEL" "$(cat /tmp/factory-prompt.md)" \
               | tee -a "${LOG}"; then
              exit 0
            fi
          fi

          # Attempt 3 (transient only, 60s backoff)
          if is_transient; then
            sleep 60
            if opencode run --auto --model "$MODEL" "$(cat /tmp/factory-prompt.md)" \
               | tee -a "${LOG}"; then
              exit 0
            fi
          fi

          # All attempts exhausted
          exit 1

      - name: Find PR URL for the issue
        id: pr-url
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXISTING_PR_URL: ${{ steps.existing-pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          if [[ -n "${EXISTING_PR_URL:-}" ]]; then
            echo "url=${EXISTING_PR_URL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREFIX="factory/issue-${ISSUE_NUMBER}-"
          # shellcheck disable=SC2016
          JQ_FILTER='([.[] | select(.head.ref | startswith($prefix)) | {updated_at: .updated_at, branch: .head.ref, number: .number, url: .html_url}] | sort_by(.updated_at) | reverse | .[0].url)'
          PR_URL="$(gh api "repos/${REPOSITORY}/pulls?state=open&per_page=100" | jq -r --arg prefix "$PREFIX" "${JQ_FILTER}")"
          if [[ -z "${PR_URL}" || "${PR_URL}" == "null" ]]; then
            echo "No PR found for issue #${ISSUE_NUMBER}" >&2
            exit 1
          fi

          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify agent pushed a branch
        env:
          EXISTING_BRANCH: ${{ steps.existing-pr.outputs.branch }}
        run: |
          set -euo pipefail
          if [[ -n "${EXISTING_BRANCH}" ]]; then
            git ls-remote --exit-code --heads origin "${EXISTING_BRANCH}"
          else
            git ls-remote --exit-code --heads origin "factory/issue-${ISSUE_NUMBER}-*"
          fi

      - name: Verify change scope
        id: scope-check
        env:
          EXISTING_BRANCH: ${{ steps.existing-pr.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin --prune

          if [[ -n "${EXISTING_BRANCH}" ]]; then
            BRANCH="${EXISTING_BRANCH}"
          else
            BRANCH="$(git ls-remote --heads origin "factory/issue-${ISSUE_NUMBER}-*" \
              | awk '{sub("^refs/heads/", "", $2); print $2}' | sort | tail -n 1)"
          fi

          git checkout -f "origin/${BRANCH}"

          BASE_SHA="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
          CHANGED="$(git diff --name-only "${BASE_SHA}" HEAD)"
          echo "Changed files:"
          echo "${CHANGED}"

          if echo "${CHANGED}" | grep -qE '^app/'; then
            (cd app && npm ci && npm test && npm run lint)
            echo "evidence=app/ changed; npm ci, npm test, and npm run lint passed" >> "$GITHUB_OUTPUT"
          else
            echo "evidence=no app/ changes; app suite skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
           name: factory-run-${{ github.event.issue.number }}
           path: ${{ runner.temp }}/factory-runs/
           if-no-files-found: ignore

      - name: Capture failure context
        if: failure()
        id: failure-context
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/factory-runs/issue-${ISSUE_NUMBER}.log"
          if [[ -f "${LOG}" ]]; then
            TAIL="$(tail -n 20 "${LOG}")"
          else
            TAIL="No agent log available."
          fi
          {
            echo "tail<<FACTORY_FAIL_EOF"
            printf '%s\n' "${TAIL}"
            echo "FACTORY_FAIL_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check circuit breaker
        if: failure()
        id: circuit-breaker
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ATTEMPT_COUNT="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --json labels --jq '[.labels[].name | select(startswith("factory-attempt-"))] | length')"
          if [[ "$ATTEMPT_COUNT" -ge 2 ]]; then
            echo "tripped=true" >> "$GITHUB_OUTPUT"
          else
            echo "tripped=false" >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" \
              --add-label "factory-attempt-$((ATTEMPT_COUNT + 1))"
          fi

      - name: Comment on issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ERROR_TAIL: ${{ steps.failure-context.outputs.tail || 'No error context available.' }}
          TRIPPED: ${{ steps.circuit-breaker.outputs.tripped }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # printf format string, not shell expansion
          if [[ "${TRIPPED}" == "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label "factory-failed"
            BODY="$(printf '❌ **Factory run failed (escalated)**\n\nThis issue has failed multiple times. Manual intervention required.\n\n**Error summary (last 20 lines):**\n```\n%s\n```\n\nSee the [workflow run](%s) for full logs.\n' \
              "$ERROR_TAIL" "$RUN_URL")"
          else
            BODY="$(printf '❌ **Factory run failed**\n\n**Error summary (last 20 lines):**\n```\n%s\n```\n\nSee the [workflow run](%s) for full logs.\n' \
              "$ERROR_TAIL" "$RUN_URL")"
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "$BODY"

      - name: Comment on issue on success
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr-url.outputs.url }}
          EVIDENCE: ${{ steps.scope-check.outputs.evidence }}
        run: |
          set -euo pipefail
          BODY="$(printf '✅ **Factory run succeeded**\n\nPull request: %s\n\n<details>\n<summary>Evidence</summary>\n\n- %s\n\n</details>\n' \
            "$PR_URL" "${EVIDENCE:-no evidence reported}")"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "$BODY"

  implement_from_comment:
    name: implement (comment)
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - name: Find existing factory PR for this issue
        id: existing-pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PREFIX="factory/issue-${ISSUE_NUMBER}-"

          PR_JSON="$(gh api "repos/${REPOSITORY}/pulls?state=open&per_page=100" 2>/dev/null || echo '[]')"
          MATCH="$(echo "$PR_JSON" | jq -r --arg prefix "$PREFIX" '
            ([ .[]
              | select(.head.ref | startswith($prefix))
              | {updated_at: .updated_at, branch: .head.ref, number: .number, url: .html_url}
            ]
            | sort_by(.updated_at)
            | reverse
            | .[0]
            )
            | select(. != null)
            | "\(.branch)\t\(.number)\t\(.url)"
          ')"

          if [[ -z "${MATCH}" || "${MATCH}" == "null" ]]; then
            EXISTING_BRANCH=""
            EXISTING_PR_NUMBER=""
            EXISTING_PR_URL=""
          else
            IFS=$'\t' read -r EXISTING_BRANCH EXISTING_PR_NUMBER EXISTING_PR_URL <<< "${MATCH}"
          fi

          {
            echo "branch=${EXISTING_BRANCH}"
            echo "pr_number=${EXISTING_PR_NUMBER}"
            echo "pr_url=${EXISTING_PR_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to run
        id: should-run
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Skip if the comment is from the factory GitHub App bot to avoid loops.
          APP_BOT_LOGIN="${{ steps.app-token.outputs.app-slug }}[bot]"
          if [[ "${COMMENT_AUTHOR}" == "${APP_BOT_LOGIN}" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if the label isn't present.
          HAS_LABEL="$(gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels" --jq 'any(.[]; .name == "factory-ready")')"
          if [[ "${HAS_LABEL}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.should-run.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        if: steps.should-run.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Set up Node.js
        if: steps.should-run.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        if: steps.should-run.outputs.run == 'true'
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        if: steps.should-run.outputs.run == 'true'
        run: |
          set -euo pipefail
          node --version
          opencode --version

      - name: Verify repository layout
        if: steps.should-run.outputs.run == 'true'
        working-directory: factory
        run: |
          set -euo pipefail
          for path in ../.github/workflows ../app ../tofu ../README.md; do
            if [[ ! -e "${path}" ]]; then
              echo "ERROR: Expected path does not exist: ${path}" >&2
              exit 1
            fi
          done
          echo "Repository layout OK"

      - name: Render agent prompt
        if: steps.should-run.outputs.run == 'true'
        working-directory: factory
        env:
          EXISTING_BRANCH: ${{ steps.existing-pr.outputs.branch }}
          EXISTING_PR_URL: ${{ steps.existing-pr.outputs.pr_url }}
          EXISTING_PR_NUMBER: ${{ steps.existing-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          template = Path("prompts/implement.md").read_text()
          rendered = template

          issue_body = os.environ.get("ISSUE_BODY", "")
          comment_body = os.environ.get("COMMENT_BODY", "").strip()
          if comment_body:
            issue_body = issue_body + "\n\nLatest comment:\n" + comment_body

          for key in ("REPOSITORY", "ISSUE_NUMBER", "ISSUE_TITLE", "ISSUE_BODY", "DEFAULT_BRANCH", "EXISTING_BRANCH", "EXISTING_PR_URL", "EXISTING_PR_NUMBER"):
            if key == "ISSUE_BODY":
              rendered = rendered.replace(f"${key}", issue_body)
            else:
              rendered = rendered.replace(f"${key}", os.environ[key])
          Path("/tmp/factory-prompt.md").write_text(rendered)
          PY

      - name: Run implementation agent
        if: steps.should-run.outputs.run == 'true'
        id: agent
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: factory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/factory-runs"
          MODEL="${OPENCODE_MODEL:-opencode/gpt-5.4-nano}"
          LOG="${RUNNER_TEMP}/factory-runs/issue-${ISSUE_NUMBER}.log"

          is_transient() {
            local tail
            tail="$(tail -n 20 "${LOG}" 2>/dev/null || echo '')"
            echo "${tail}" | grep -qiE "rate.limit|timeout|ECONNRESET|ETIMEDOUT|502|503|network error|connection refused|EAI_AGAIN|ENOTFOUND|too many requests|429"
          }

          # Attempt 1
          if opencode run --auto --model "$MODEL" "$(cat /tmp/factory-prompt.md)" \
             | tee "${LOG}"; then
            exit 0
          fi

          # Attempt 2 (transient only, 30s backoff)
          if is_transient; then
            sleep 30
            if opencode run --auto --model "$MODEL" "$(cat /tmp/factory-prompt.md)" \
               | tee -a "${LOG}"; then
              exit 0
            fi
          fi

          # Attempt 3 (transient only, 60s backoff)
          if is_transient; then
            sleep 60
            if opencode run --auto --model "$MODEL" "$(cat /tmp/factory-prompt.md)" \
               | tee -a "${LOG}"; then
              exit 0
            fi
          fi

          # All attempts exhausted
          exit 1

      - name: Find PR URL for the issue
        id: pr-url
        if: steps.should-run.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXISTING_PR_URL: ${{ steps.existing-pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          if [[ -n "${EXISTING_PR_URL:-}" ]]; then
            echo "url=${EXISTING_PR_URL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREFIX="factory/issue-${ISSUE_NUMBER}-"
          # shellcheck disable=SC2016
          JQ_FILTER='([.[] | select(.head.ref | startswith($prefix)) | {updated_at: .updated_at, branch: .head.ref, number: .number, url: .html_url}] | sort_by(.updated_at) | reverse | .[0].url)'
          PR_URL="$(gh api "repos/${REPOSITORY}/pulls?state=open&per_page=100" | jq -r --arg prefix "$PREFIX" "${JQ_FILTER}")"
          if [[ -z "${PR_URL}" || "${PR_URL}" == "null" ]]; then
            echo "No PR found for issue #${ISSUE_NUMBER}" >&2
            exit 1
          fi

          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify agent pushed a branch
        env:
          EXISTING_BRANCH: ${{ steps.existing-pr.outputs.branch }}
        if: steps.should-run.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [[ -n "${EXISTING_BRANCH}" ]]; then
            git ls-remote --exit-code --heads origin "${EXISTING_BRANCH}"
          else
            git ls-remote --exit-code --heads origin "factory/issue-${ISSUE_NUMBER}-*"
          fi

      - name: Verify change scope
        id: scope-check
        env:
          EXISTING_BRANCH: ${{ steps.existing-pr.outputs.branch }}
        if: steps.should-run.outputs.run == 'true'
        run: |
          set -euo pipefail
          git fetch origin --prune

          if [[ -n "${EXISTING_BRANCH}" ]]; then
            BRANCH="${EXISTING_BRANCH}"
          else
            BRANCH="$(git ls-remote --heads origin "factory/issue-${ISSUE_NUMBER}-*" \
              | awk '{sub("^refs/heads/", "", $2); print $2}' | sort | tail -n 1)"
          fi

          git checkout -f "origin/${BRANCH}"

          BASE_SHA="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
          CHANGED="$(git diff --name-only "${BASE_SHA}" HEAD)"
          echo "Changed files:"
          echo "${CHANGED}"

          if echo "${CHANGED}" | grep -qE '^app/'; then
            (cd app && npm ci && npm test && npm run lint)
            echo "evidence=app/ changed; npm ci, npm test, and npm run lint passed" >> "$GITHUB_OUTPUT"
          else
            echo "evidence=no app/ changes; app suite skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload agent log
        if: always() && steps.should-run.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
           name: factory-run-${{ github.event.issue.number }}
           path: ${{ runner.temp }}/factory-runs/
           if-no-files-found: ignore

      - name: Comment on issue on failure
        if: failure() && steps.should-run.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "$(printf '❌ **Factory run failed**\n\nSee the [workflow run](%s) for logs.\n' "$RUN_URL")"

      - name: Comment on issue on success
        if: success() && steps.should-run.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr-url.outputs.url }}
          EVIDENCE: ${{ steps.scope-check.outputs.evidence }}
        run: |
          set -euo pipefail
          BODY="$(printf '✅ **Factory run succeeded**\n\nPull request: %s\n\n<details>\n<summary>Evidence</summary>\n\n- %s\n\n</details>\n' \
            "$PR_URL" "${EVIDENCE:-no evidence reported}")"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "$BODY"
